[pytest]
testpaths = tests
# tests/ is on the path so the integration module can import its helpers from
# conftest by name.
pythonpath = . tests
addopts = -q --strict-markers
markers =
    integration: runs real ffmpeg against real media (needs ffmpeg installed)

# An xfail that starts passing is an error, not a quiet success. Every xfail in
# this suite describes a defect that is still real, so one passing means it has
# been fixed and its marker should be deleted rather than left to rot.
xfail_strict = true
