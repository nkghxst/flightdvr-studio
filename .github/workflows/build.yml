# Tests on all three platforms, and a packaged build for each of them.
#
# The Windows installer bundles ffmpeg, and THIRD-PARTY-NOTICES.md names the
# exact build it bundles and offers that build's corresponding source. That is
# why packaging/ffmpeg-build.json carries an immutable URL and hashes: the job
# fetches precisely that archive and refuses anything else, which is the same
# check packaging/build.ps1 makes locally rather than a weaker substitute.

name: Build

on:
  push:
    # Every branch, not just main: this is a one-person project, so a branch
    # push is the point at which feedback is useful. Public repositories get
    # unlimited free runner minutes, so there is nothing to ration.
    branches: ["**"]
    tags: ["v*"]
    # Prose changes nothing a build could verify. Tags are exempt, so a release
    # is still built even if the tagged commit only touched the changelog.
    paths-ignore: ["**.md", "docs/**", ".gitattributes"]
  # For forks. A fork's commits are never pushed to this repository, so the
  # push trigger above cannot see them and check runs have nothing to attach
  # to: #131 was the first outside contribution and sat with no checks at all,
  # with no way to start them. Dispatching by hand does not help, because
  # workflow_dispatch takes a branch or tag here and refs/pull/N/head is not
  # dispatchable. A pull request from a branch in this repository is skipped --
  # see the guard on the test job -- because its own push already built it.
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitattributes"]
  workflow_dispatch:

# A fork pull request runs code nobody here has vetted, so the default token
# stays read-only and the repository has no secrets for such a run to take.
# The one job that needs more asks for contents: write itself, and is gated on
# a tag ref -- github.ref is refs/pull/N/merge on a pull request, so it can
# never match. Never use pull_request_target to build fork code: that runs in
# a privileged context and would hand a stranger a writable token.
permissions:
  contents: read

# Pushing again while a run is in flight cancels the older one. Tags are kept
# out of it: a release build should never be cancelled by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    # The pull_request trigger exists for forks only. A pull request from a
    # branch in this repository was already built by the push that created it,
    # so skip the duplicate. Every packaging job needs this one, so they skip
    # with it rather than each repeating the condition.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # PySide6 loads these at import time even under the offscreen platform.
      - name: Install Qt's runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      # The integration tests encode real media and inspect what comes out.
      # Without ffmpeg they skip, which would quietly leave the part of the
      # suite that actually catches things unrun.
      - name: Install ffmpeg
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get install -y --no-install-recommends ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress -y ;;
          esac
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # -rs reports skips. The integration tests skip themselves when ffmpeg is
      # absent, so the summary is what tells you whether the half of the suite
      # that actually catches things really ran. The step above fails the job
      # outright if ffmpeg is missing.
      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -rsx

  appimage:
    name: Linux AppImage
    needs: test
    # Built on the oldest supported LTS on purpose: an AppImage carries no
    # glibc, so one built on 24.04 refuses to start on 22.04. If this runner
    # label is ever retired, ubuntu-latest works but raises the glibc floor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt's runtime libraries and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Prove configured audio exports on the oldest packaged-system ffmpeg
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ffmpeg -version | head -n 1
          python -m pytest -q tests/test_audio_export.py tests/test_music_export_media.py tests/test_sequence_music_export_media.py -rs

      # The AppImage bundles exactly the build in packaging/ffmpeg-build-linux.json,
      # which THIRD-PARTY-NOTICES.md names. The fetcher checks the archive's size
      # and hash before opening it and both programs after, and publishes the
      # folder only when everything has passed.
      - name: Fetch the pinned Linux ffmpeg
        id: ffmpeg
        run: |
          folder="$(packaging/fetch-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-linux")"
          echo "dir=$folder" >> "$GITHUB_OUTPUT"

      # Identity, configuration, encoders and filters, and the ELF requirements
      # read by readelf and objdump, on the oldest system the AppImage supports.
      - name: Inspect the pinned pair on the baseline system
        run: |
          python packaging/check_linux_bundle.py inspect-pair \
            "${{ steps.ffmpeg.outputs.dir }}" "$RUNNER_TEMP/evidence/baseline/inspect-pair"

      - name: Export generated media through the pinned pair
        run: |
          python packaging/check_linux_bundle.py export-check \
            "${{ steps.ffmpeg.outputs.dir }}" "$RUNNER_TEMP/evidence/baseline/export-check"

      # The app's own export paths, with the pinned pair first on PATH. The step
      # above proves the system copy still works; this proves the bundled one.
      - name: Prove the media exports on the pinned Linux pair
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          folder="${{ steps.ffmpeg.outputs.dir }}"
          export PATH="$folder:$PATH"
          test "$(command -v ffmpeg)" = "$folder/ffmpeg"
          test "$(command -v ffprobe)" = "$folder/ffprobe"
          ffmpeg -version | sed -n 1p
          python -m pytest -q -rs \
            tests/test_audio_export.py tests/test_music_export_media.py \
            tests/test_sequence_music_export_media.py tests/test_audio_reader_media.py \
            tests/test_integration.py tests/test_media_correctness.py \
            tests/test_slow_motion_media.py tests/test_vertical_media.py \
            tests/test_preview_recipe_media.py

      - name: Build
        env:
          FFMPEG_DIR: ${{ steps.ffmpeg.outputs.dir }}
        run: packaging/build-appimage.sh

      # What the AppImage's FFmpeg and its carried libraries are built from:
      # FFmpeg and the build system at the pinned commits, the build system's
      # declared dependency sources, and the distribution packages the two
      # carried libraries were copied from on this build machine.
      - name: Collect the Linux FFmpeg source material
        run: |
          python packaging/check_linux_bundle.py source-material \
            dist/FlightDVRStudio/_internal "$RUNNER_TEMP/linux-ffmpeg-source"

      # Internal input for the linux-ffmpeg-source job, not a release file.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ffmpeg-source-inputs
          path: ${{ runner.temp }}/linux-ffmpeg-source
          if-no-files-found: error

      # The build's own smoke check ran with a system ffmpeg installed. Take it
      # away so the packaged app can only succeed through its bundle.
      # The child-process environment inside the actual AppImage (#131): an
      # external program gets the loader path that was there before the app,
      # the bundled pair keeps the bundle's; and the runner's own system
      # ffmpeg, named explicitly while it is still installed, runs through the
      # app's probe and streaming reader. The normal discovery is unchanged.
      - name: Check the child environment, with the system ffmpeg as external tools
        run: |
          python packaging/check_linux_bundle.py environment-check \
            dist/*.AppImage "$RUNNER_TEMP/evidence/baseline/environment-check" /usr/bin

      - name: Remove the system ffmpeg
        run: |
          sudo apt-get remove -y ffmpeg
          if command -v ffmpeg || command -v ffprobe; then exit 1; fi

      - name: Check the built AppImage with no system ffmpeg
        run: |
          python packaging/check_linux_bundle.py appimage-check \
            dist/*.AppImage "$RUNNER_TEMP/evidence/baseline/appimage-check"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bundle-evidence-ubuntu-22.04
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/**/extract
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  appimage-current-linux:
    name: Linux AppImage on current Ubuntu
    needs: appimage
    # The same artifact on the newest runner: built for 22.04, it has to keep
    # working on what people install today, without a system ffmpeg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Qt's runtime libraries, and this release's ffmpeg for the external phase
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            ffmpeg

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist

      - name: Check the child environment, with the system ffmpeg as external tools
        run: |
          chmod +x dist/*.AppImage
          python packaging/check_linux_bundle.py environment-check \
            dist/*.AppImage "$RUNNER_TEMP/evidence/current/environment-check" /usr/bin

      - name: Remove the system ffmpeg
        run: |
          sudo apt-get remove -y ffmpeg
          if command -v ffmpeg || command -v ffprobe; then exit 1; fi

      - name: Check the built AppImage with no system ffmpeg
        run: |
          python packaging/check_linux_bundle.py appimage-check \
            dist/*.AppImage "$RUNNER_TEMP/evidence/current/appimage-check"

      # The pair exactly as shipped, read out of the AppImage above.
      - name: Inspect and export through the bundled pair on current Ubuntu
        run: |
          pair="$RUNNER_TEMP/evidence/current/appimage-check/extract/squashfs-root/usr/bin/_internal/ffmpeg"
          python packaging/check_linux_bundle.py inspect-pair "$pair" "$RUNNER_TEMP/evidence/current/inspect-pair"
          python packaging/check_linux_bundle.py export-check "$pair" "$RUNNER_TEMP/evidence/current/export-check"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bundle-evidence-ubuntu-latest
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/**/extract
          if-no-files-found: warn

  macos:
    name: macOS app
    needs: test
    # Apple Silicon only. Every Mac sold since late 2020 is arm64 and the Intel
    # runners are being retired; adding an x86_64 build back is a second entry
    # in a matrix here, since build-macos.sh already names its output by arch.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Build
        run: packaging/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      # Exactly the build described in packaging/ffmpeg-build.json, verified by
      # hash before it is unpacked. A different binary would make the offer of
      # corresponding source in THIRD-PARTY-NOTICES.md false.
      - name: Fetch the pinned ffmpeg
        id: ffmpeg
        shell: pwsh
        run: |
          $folder = ./packaging/fetch-ffmpeg.ps1 -Into "$env:RUNNER_TEMP/ffmpeg" |
            Select-Object -Last 1
          "dir=$folder" >> $env:GITHUB_OUTPUT

      - name: Prove configured audio exports on the pinned bundled ffmpeg
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $folder = "${{ steps.ffmpeg.outputs.dir }}"
          $env:PATH = "$folder;$env:PATH"
          $pin = Get-Content packaging/ffmpeg-build.json -Raw | ConvertFrom-Json
          $selected = & (Join-Path $folder "ffmpeg.exe") -version |
            Select-Object -First 1
          Write-Output $selected
          if ($selected -notlike "*$($pin.version)*") {
            throw "Selected ffmpeg is not the pinned $($pin.version) build."
          }
          python -m pytest -q tests/test_audio_export.py tests/test_music_export_media.py tests/test_sequence_music_export_media.py -rs

      # The same script the maintainer runs, so there is one build rather than
      # two that can drift. It verifies the binaries against the pin again,
      # bundles, launches the packaged app to prove it starts without ffmpeg on
      # PATH, and only then builds the installer.
      #
      # -SkipTests because this job needs the test job, which has already run
      # the suite on this platform; the local default still runs them.
      - name: Build the installer
        shell: pwsh
        run: ./packaging/build.ps1 -FfmpegDir "${{ steps.ffmpeg.outputs.dir }}" -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  linux-ffmpeg-source:
    name: Linux FFmpeg source bundle
    needs: appimage
    # On the same release as the AppImage build, so the Ubuntu source packages
    # match the carried libraries recorded there. Fetches the source of every
    # dependency stage the pinned build system enables, with its own recipes,
    # and writes one bundle with a manifest and build instructions; anything
    # required that cannot be fetched or matched fails the job, and no bundle
    # is uploaded.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the source-fetching tools the build system's recipes use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion

      - uses: actions/download-artifact@v4
        with:
          name: linux-ffmpeg-source-inputs
          path: ${{ runner.temp }}/source-inputs

      - name: Collect the corresponding source
        run: |
          python packaging/collect_linux_sources.py collect \
            "$RUNNER_TEMP/source-inputs" "$RUNNER_TEMP/source-bundle"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ffmpeg-source-report
          path: ${{ runner.temp }}/source-bundle/*.manifest.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: linux-ffmpeg-source
          path: |
            ${{ runner.temp }}/source-bundle/*-linux-ffmpeg-source.tar
            ${{ runner.temp }}/source-bundle/*-linux-ffmpeg-source.manifest.json
          if-no-files-found: error

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, appimage-current-linux, linux-ffmpeg-source, macos, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Only the named release artifacts, each into its own folder; internal
      # evidence and inputs are never downloaded here.
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/linux-appimage

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows-installer

      - uses: actions/download-artifact@v4
        with:
          name: linux-ffmpeg-source
          path: artifacts/linux-ffmpeg-source

      # Exactly one AppImage, .dmg, installer and source bundle, or it fails.
      - name: Select the files to attach
        run: python3 packaging/collect_linux_sources.py select-release-files artifacts release-files

      # Drafted rather than published. What is automated is the building, not
      # the shipping: a person still writes the notes and decides to publish.
      - name: Upload the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh release-files
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --repo "$GITHUB_REPOSITORY" --draft \
                 --title "$GITHUB_REF_NAME" \
                 --notes "Windows, Linux and macOS builds attached automatically."
          gh release upload "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" --clobber
